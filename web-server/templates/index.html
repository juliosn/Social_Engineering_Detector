<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Engineering Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f8f9fa;
            padding-top: 40px;
        }
        .container {
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        textarea {
            font-family: monospace;
        }
        .result {
            margin-top: 20px;
        }
        .result h3 {
            font-weight: 700;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">Social Engineering</h1>

        <form method="post" novalidate>
            <div class="mb-3">
                <label for="message" class="form-label">Paste your message below:</label>
                <textarea id="message" name="message" rows="10" class="form-control" placeholder="Paste your message here...">{{ email_text or '' }}</textarea>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Detect</button>
            </div>
        </form>

        {% if prediction is not none %}
            <div class="result alert mt-4 
                {% if prediction == 1 %}alert-danger{% else %}alert-success{% endif %}" role="alert">
                <h3>Prediction: {{ "Social Engineering" if prediction == 1 else "Not Social Engineering" }}</h3>
                <p>Probability: {{ '%.2f'|format(probability * 100) }}%</p>
            </div>
        {% endif %}
    </div>

    <div class="footer">
        &copy; 2025 Fatec-ZL Team
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
